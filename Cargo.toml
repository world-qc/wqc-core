[package]
name = "wqc-core"
version = "0.1.0"
edition = "2021"
authors = ["World Quantum Computer Contributors"]
license = "GPL-3.0"

[dependencies]
# Numerical computing for quantum states
ndarray = { version = "0.15", features = ["serde"] }
# Multithreaded GEMM for network tree contractions (ndarray uses it)
matrixmultiply = { version = "0.3", features = ["threading", "cgemm"] }
num-complex = { version = "0.4", features = ["serde"] }
# Parallel processing for memory-bound tasks
sysinfo = "0.30"
rayon = "1.8"
# MPS bond truncation (SVD)
nalgebra = "0.33"
# zk-STARKs Engine Integration
wqc-stark-engine = { git = "https://github.com/world-qc/wqc-stark-engine.git", branch = "main", package = "wqc-stark-core", features = ["plonky3-stark"] }
# v2 (sv-stark) leaves: the prover the orchestrator's FFI verifier is built from.
wqc-sv-stark = { git = "https://github.com/world-qc/wqc-stark-engine.git", branch = "main" }
# wqc-sv-stark's field version, to read its Goldilocks statement as integers.
p3-field-sv = { package = "p3-field", version = "=0.9.0-rc.2" }
p3-field = "0.6.1"
p3-mersenne-31 = "0.6.1"
# Utilities
hex = "0.4"
rand = "0.8"
sha3 = "0.12.0"
base64 = "0.22"
colored = "2.1"
# Web server framework
axum = "0.7"
tokio = { version = "1.0", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tower-http = { version = "0.5", features = ["cors"] }
tower = "0.4"
hyper-util = { version = "0.1", features = ["server-auto", "tokio"] }
# EnumIter
strum = "0.28"
strum_macros = "0.28"
# WebGPU MPS kernels (optional)
wgpu = { version = "24", optional = true }
pollster = { version = "0.4", optional = true }
bytemuck = { version = "1", features = ["derive"], optional = true }

[features]
default = []
webgpu = ["dep:wgpu", "dep:pollster", "dep:bytemuck"]

# Sibling-repo local override — checkout `wqc-stark-engine/` next to `wqc-core/` (Docker build uses the same sibling layout).
[patch."https://github.com/world-qc/wqc-stark-engine.git"]
wqc-stark-core = { path = "../wqc-stark-engine/wqc-stark-core" }
wqc-sv-stark = { path = "../wqc-stark-engine/wqc-sv-stark" }

[profile.release]
opt-level = 3
lto = true
codegen-units = 1

# Plonky3-recursion's crates (under wqc-sv-stark) are large; a single codegen unit takes most
# of an hour each.
[profile.release.package.p3-recursion]
codegen-units = 16

[profile.release.package.p3-circuit]
codegen-units = 16

[profile.release.package.p3-circuit-prover]
codegen-units = 16
